version: '3.8'

services:
  agent-app:
    build: .
    container_name: liquidity-agent
    ports:
      - "8501:8501"
    volumes:
      # We ONLY mount the directory, not the individual file, to avoid permission issues
      # if the file doesn't exist yet on the host.
      - .:/app
      # Alternatively, we can use named volumes for persistence if host mounting is tricky:
      # - agent_data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "python initialize_system.py && streamlit run main.py"
